services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-trixie@sha256:4c09888a2acdaf619daa79d2e811329536450a1045be9243fe03d4b02c81e91e
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:db
    command: sleep infinity

  db:
    image: mongo:8.3@sha256:0f99e1f5827518188f9aa46c847d86b3cbf6e2d3e9e752299630081bc0079380
    restart: unless-stopped
    environment:
      # Work around MongoDB 8.0+ startup crashes on Linux kernel 6.19
      # https://jira.mongodb.org/browse/SERVER-121912?focusedId=839528
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb-data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongodb-data:
  mongo_config:
