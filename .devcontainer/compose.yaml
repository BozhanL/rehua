services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-trixie@sha256:5d4dfbb91a7d76906484ff55f69a883eb8ed3c2628ab5611a826c94b06f09fe2
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:db
    command: sleep infinity

  db:
    image: mongo:8.3@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    restart: unless-stopped
    environment:
      # Work around MongoDB 8.0+ startup crashes on Linux kernel 6.19
      # https://jira.mongodb.org/browse/SERVER-121912?focusedId=839528
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb-data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongodb-data:
  mongo_config:
