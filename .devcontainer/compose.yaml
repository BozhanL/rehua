services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-trixie@sha256:91dc841966e9b47195a1a6290a8ef9bba5ba43c02aa22f87f8669c16bb6f0f6e
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:db
    command: sleep infinity

  db:
    image: mongo:8.3@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    restart: unless-stopped
    environment:
      # Work around MongoDB 8.0+ startup crashes on Linux kernel 6.19
      # https://jira.mongodb.org/browse/SERVER-121912?focusedId=839528
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb-data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongodb-data:
  mongo_config:
