services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-trixie@sha256:cba90c28e53ac2f5a8a5a0388b71b8e98bbe1a4711e0faaa6ef48b137037d4ae
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:db
    command: sleep infinity

  db:
    image: mongo:8.3@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    restart: unless-stopped
    environment:
      # Work around MongoDB 8.0+ startup crashes on Linux kernel 6.19
      # https://jira.mongodb.org/browse/SERVER-121912?focusedId=839528
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb-data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongodb-data:
  mongo_config:
